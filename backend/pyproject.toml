[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socrates-duck-backend"
version = "0.0.1"
description = "Local backend for the Socrates' Duck VS Code extension."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "litellm>=1.101",
  "langgraph>=1.2",
  "langsmith>=0.13",
  "sqlalchemy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.13", "ruff>=0.8"]

[tool.setuptools]
packages = ["api", "domain", "persistence", "policies", "providers", "workflows"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# FastAPI's Depends(...) in default arguments is intended usage.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
